[tool.poetry]
name = "GridSearcher"
version = "0.1.0+py38"
description = "A grid search tool for research"
authors = ["Paolo Ginefra <ginefra.paolo@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "GridSearcher", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
pytest = ">=8,<9.0.0"
pyyaml = ">=6.0.2,<7.0.0"
alive-progress = ">=2"

[build-system]
requires = ["poetry-core>=1.3,<2.0.0"]
build-backend = "poetry.core.masonry.api"
